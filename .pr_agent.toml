[config]
# Full context for PR review
add_repo_metadata = true
add_repo_metadata_file_list = ["AGENTS.MD", "AGENTS.md", "CLAUDE.MD", "QODO.MD", "CONTRIBUTING.md", "README.md"]
allow_dynamic_context = true
max_extra_lines_before_dynamic_context = 15
patch_extra_lines_before = 15
patch_extra_lines_after = 10
large_patch_policy = "clip"
max_model_tokens = 128000

[pr_reviewer]
enable_review_labels_effort = true
enable_auto_approval = true

[github_app]
pr_commands = [
    "/describe --pr_description.publish_description_as_comment=true",
    "/improve",
    "/agentic_review"
]

handle_push_trigger = true
push_commands = [
    "/improve",
    "/agentic_review"
]

[review_agent]
enabled = true
publish_output = true
